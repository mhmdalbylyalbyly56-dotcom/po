<script>
const $=s=>document.querySelector(s),sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const tabs=[["learn","الشرح والتطبيق","Lesson & practice"],["quiz","أسئلة البنك","Question bank"],["game","لعبة التدريبات","Exercises game"],["code","لعبة الروبوت","Code Robot"]];
$("#nav").innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}<small>${t[2]}</small></button>`).join("");
/* ---------- safe-ish code runner ---------- */
function fmt(v){return typeof v=="string"?v:(v&&typeof v=="object")?JSON.stringify(v):String(v)}
function exec(code,api){const out=[];const cons={log:(...a)=>out.push(a.map(fmt).join(" "))};
const src=code.replace(/\b(while|for)\s*\(([^)]*)\)\s*\{/g,'$1($2){if(++__n>1e5)throw new Error("Loop too long / التكرار طويل جداً");').replace(/\bdo\s*\{/g,'do{if(++__n>1e5)throw new Error("Loop too long / التكرار طويل جداً");');
const names=Object.keys(api||{});
try{new Function("console","prompt","alert",...names,"let __n=0;\n"+src)(cons,()=>"",m=>out.push(fmt(m)),...names.map(k=>api[k]))}
catch(e){return{out,err:e instanceof EvalError?"المتصفح منع تشغيل الكود هنا. افتحي نسخة الملف على جهازك. / Code running is blocked here; open the downloaded file version.":(e.message||String(e))}}
return{out,err:null}}
/* ---------- LESSON ---------- */
// [AR title, EN title, AR text, EN text, example, AR task, EN task, starter, solution]
const S=[
["١. الجمل الشرطية","1. Conditional statements",[
["جملة if","The if statement","تنفّذ الكود فقط إذا كان الشرط true.","Runs code only if the condition is true.","let age = 20;\nif (age >= 18) {\n  console.log(\"Adult\");\n}","لو score أكبر من أو تساوي 60 اطبعي Pass.","If score is 60 or more, print Pass.","let score = 75;\n","let score = 75;\nif (score >= 60) {\n  console.log(\"Pass\");\n}"],
["جملة else","The else statement","else تُنفَّذ لما يكون شرط if غير صحيح.","else runs when the if condition is false.","let score = 55;\nif (score >= 60) {\n  console.log(\"Pass\");\n} else {\n  console.log(\"Failed\");\n}","لو temp أكبر من 30 اطبعي Hot وإلا اطبعي Cool.","If temp is above 30 print Hot, otherwise print Cool.","let temp = 35;\n","let temp = 35;\nif (temp > 30) {\n  console.log(\"Hot\");\n} else {\n  console.log(\"Cool\");\n}"],
["جملة else if","The else if statement","لفحص أكثر من شرط بالترتيب.","Checks several conditions in order.","let m = 85;\nif (m >= 90) console.log(\"A\");\nelse if (m >= 75) console.log(\"B\");\nelse console.log(\"C\");","marks: من 90 فأكثر A، من 75 B، من 50 C، غير كده F.","marks: 90+ → A, 75+ → B, 50+ → C, otherwise F.","let marks = 65;\n","let marks = 65;\nif (marks >= 90) {\n  console.log(\"A\");\n} else if (marks >= 75) {\n  console.log(\"B\");\n} else if (marks >= 50) {\n  console.log(\"C\");\n} else {\n  console.log(\"F\");\n}"],
["العامل الثلاثي ? :","Ternary operator","شكل مختصر لـ if…else يرجّع قيمة: condition ? value1 : value2","A short form of if…else that returns a value: condition ? value1 : value2","let marks = 70;\nlet result = marks >= 40 ? \"pass\" : \"fail\";\nconsole.log(\"You \" + result);","اطبعي Even لو n زوجي وإلا Odd باستخدام ? :","Print Even if n is even, else Odd, using ? :","let n = 7;\n","let n = 7;\nconsole.log(n % 2 === 0 ? \"Even\" : \"Odd\");"],
["جملة switch","The switch statement","تقارن قيمة واحدة بعدة حالات case، و break توقف التنفيذ، و default لو مفيش تطابق.","Compares one value with many cases; break stops execution; default runs if nothing matches.","let games = \"football\";\nswitch (games) {\n  case \"cricket\":\n    console.log(\"Cricket!\");\n    break;\n  case \"football\":\n    console.log(\"I love football!\");\n    break;\n  default:\n    console.log(\"Other games\");\n}","day = 1 اطبعي Sat، و2 اطبعي Sun، وغير كده Other.","day 1 → Sat, 2 → Sun, anything else → Other.","let day = 2;\n","let day = 2;\nswitch (day) {\n  case 1:\n    console.log(\"Sat\");\n    break;\n  case 2:\n    console.log(\"Sun\");\n    break;\n  default:\n    console.log(\"Other\");\n}"]]],
["٢. الحلقات التكرارية","2. Loops",[
["حلقة while","The while loop","تكرر الكود طالما الشرط true، وتفحص الشرط أولاً.","Repeats while the condition is true; checks the condition first.","let i = 0;\nwhile (i < 5) {\n  console.log(\"The number is \" + i);\n  i++;\n}","اطبعي الأرقام 1 و2 و3 باستخدام while.","Print 1, 2, 3 using while.","let i = 1;\n","let i = 1;\nwhile (i <= 3) {\n  console.log(i);\n  i++;\n}"],
["حلقة do…while","The do…while loop","تنفّذ الكود مرة واحدة على الأقل ثم تفحص الشرط.","Runs the code at least once, then checks the condition.","let i = 10;\ndo {\n  console.log(\"i = \" + i);\n  i++;\n} while (i < 5);","x = 100 والشرط x < 5 خطأ، ومع ذلك اطبعي Hi مرة واحدة.","x = 100 and x < 5 is false, yet print Hi once.","let x = 100;\n","let x = 100;\ndo {\n  console.log(\"Hi\");\n} while (x < 5);"],
["حلقة for","The for loop","for(begin; condition; step): البداية مرة، ثم الشرط، ثم الخطوة بعد كل دورة.","for(begin; condition; step): begin once, then the condition, then the step after each round.","for (let i = 0; i < 5; i++) {\n  console.log(\"The number is \" + i);\n}","اطبعي الأعداد الزوجية 2 4 6 8 10 كل رقم في سطر.","Print the even numbers 2 4 6 8 10, one per line.","","for (let i = 2; i <= 10; i += 2) {\n  console.log(i);\n}"],
["الأمر break","The break statement","يوقف الحلقة فوراً.","Stops the loop immediately.","for (let i = 0; i < 10; i++) {\n  if (i === 5) {\n    break;\n  }\n  console.log(i);\n}","اطبعي من 0 وتوقفي قبل 3 (0 1 2) باستخدام break.","Print 0 1 2 and stop at 3 using break.","for (let i = 0; i < 10; i++) {\n  \n}","for (let i = 0; i < 10; i++) {\n  if (i === 3) {\n    break;\n  }\n  console.log(i);\n}"],
["الأمر continue","The continue statement","يتخطى الدورة الحالية وينتقل للتي بعدها.","Skips the current round and moves to the next.","for (let i = 0; i < 5; i++) {\n  if (i % 2 === 0) {\n    continue;\n  }\n  console.log(i);\n}","اطبعي 0 1 3 4 (تخطي الرقم 2) باستخدام continue.","Print 0 1 3 4 (skip 2) using continue.","for (let i = 0; i < 5; i++) {\n  \n}","for (let i = 0; i < 5; i++) {\n  if (i === 2) {\n    continue;\n  }\n  console.log(i);\n}"]]],
["٣. الدوال","3. Functions",[
["تعريف الدالة","Defining a function","كتلة كود قابلة لإعادة الاستخدام: function name(parameters) { … }","A reusable block of code: function name(parameters) { … }","function greet(name) {\n  console.log(\"Hello, \" + name + \"!\");\n}\ngreet(\"Asmaa\");","اكتبي دالة sayHi(name) تطبع Hi, Ali لما نستدعيها sayHi(\"Ali\").","Write sayHi(name) that prints Hi, Ali when called as sayHi(\"Ali\").","","function sayHi(name) {\n  console.log(\"Hi, \" + name);\n}\nsayHi(\"Ali\");"],
["Parameters و Arguments و return","Parameters, arguments & return","Parameters أسماء في التعريف، Arguments القيم وقت الاستدعاء، و return يرجّع الناتج.","Parameters are names in the definition, arguments are the values you pass, return gives back a result.","function add(num1, num2) {\n  return num1 + num2;\n}\nlet result = add(3, 4);\nconsole.log(result);","اكتبي دالة mul(a, b) ترجّع a*b، واطبعي mul(6, 7).","Write mul(a, b) that returns a*b and print mul(6, 7).","","function mul(a, b) {\n  return a * b;\n}\nconsole.log(mul(6, 7));"],
["Function expression و Arrow function","Function expression vs arrow","الاتنين طريقتين لتعريف دالة داخل متغير؛ الـ Arrow أقصر باستخدام =>","Two ways to store a function in a variable; the arrow form is shorter, using =>","const multiply = function (x, y) {\n  return x * y;\n};\nlet multiply2 = (x, y) => x * y;\nconsole.log(multiply(2, 5), multiply2(3, 4));","اكتبي arrow function باسم square ترجّع x*x، واطبعي square(9).","Write an arrow function square that returns x*x and print square(9).","","const square = x => x * x;\nconsole.log(square(9));"],
["النطاق Scope","Scope","Global: متاح في كل مكان. Local: داخل الدالة فقط.","Global: available everywhere. Local: only inside the function.","let g = \"global\";\nfunction f() {\n  let l = \"local\";\n  console.log(g, l);\n}\nf();\nconsole.log(typeof l);","عرّفي total = 10 خارج الدالة، ودالة addFive تطبع total + 5، ثم استدعيها.","Define total = 10 outside, a function addFive that prints total + 5, then call it.","","let total = 10;\nfunction addFive() {\n  console.log(total + 5);\n}\naddFive();"]]],
["٤. الدوال الجاهزة","4. Built-in functions",[
["دوال Math","Math functions","abs و ceil و floor و round و max و min و random.","abs, ceil, floor, round, max, min, random.","console.log(Math.abs(-7));\nconsole.log(Math.ceil(4.1));\nconsole.log(Math.floor(4.9));\nconsole.log(Math.round(4.5));\nconsole.log(Math.max(3, 9, 2), Math.min(3, 9, 2));\nconsole.log(Math.random());","اطبعي Math.max(4, 12, 7) ثم Math.floor(8.9) كل واحد في سطر.","Print Math.max(4, 12, 7) then Math.floor(8.9), each on its own line.","","console.log(Math.max(4, 12, 7));\nconsole.log(Math.floor(8.9));"],
["دوال النصوص","String functions","length و toUpperCase و toLowerCase و indexOf و substring و trim.","length, toUpperCase, toLowerCase, indexOf, substring, trim.","const text = \"Hello World\";\nconsole.log(text.length);\nconsole.log(text.toUpperCase());\nconsole.log(text.indexOf(\"World\"));\nconsole.log(text.substring(6, 11));\nconsole.log(\"  hi  \".trim());","text = \"  Hello JS  \": احذفي المسافات ثم حوّليه لحروف كبيرة.","text = \"  Hello JS  \": trim it then make it uppercase.","const text = \"  Hello JS  \";\n","const text = \"  Hello JS  \";\nconsole.log(text.trim().toUpperCase());"],
["دوال التاريخ","Date functions","new Date() و getFullYear و getMonth (من 0) و getDate و getDay (0 = الأحد).","new Date(), getFullYear, getMonth (0-based), getDate, getDay (0 = Sunday).","const d = new Date(2025, 5, 7);\nconsole.log(d.getFullYear());\nconsole.log(d.getMonth());\nconsole.log(d.getDate());\nconsole.log(d.getDay());","const d = new Date(2025, 5, 7): اطبعي السنة ثم الشهر.","With d = new Date(2025, 5, 7): print the year, then the month.","const d = new Date(2025, 5, 7);\n","const d = new Date(2025, 5, 7);\nconsole.log(d.getFullYear());\nconsole.log(d.getMonth());"]]]];
const app=$("#app");let ek=0;
const edHTML=(code,id,task)=>`<div class="ed" id="${id}"><textarea spellcheck="false" autocapitalize="off" autocomplete="off" rows="${Math.max(3,code.split("\n").length)}">${esc(code)}</textarea><div class="ctl"><button class="bt run">▶ شغّل / Run</button>${task!=null?`<button class="bt y chk">✔ تحقق / Check</button><button class="bt g sol">💡 الحل / Solution</button>`:""}</div><div class="out" aria-live="polite"></div></div>`;
const SOL={};
app.insertAdjacentHTML("beforeend",`<section id="learn" hidden><h2>الشرح مع التطبيق العملي<small>Lesson with hands-on practice</small></h2><p style="margin-bottom:6px">كل نقطة فيها: شرح ← مثال تشغّلينه ← مهمة تكتبي كودها وتشوفي الناتج. / Each part: explanation → a runnable example → a task for you to code.</p>${S.map(s=>`<div class="sec">${s[0]}<small>${s[1]}</small></div>${s[2].map(it=>{const a=++ek;SOL["t"+a]=it[8];return `<div class="it"><h3>${it[0]} <span>· ${it[1]}</span></h3><div class="two"><p dir="rtl">${it[2]}</p><p dir="ltr">${it[3]}</p></div><div class="lb">① مثال / Example</div>${edHTML(it[4],"e"+a)}<div class="lb">② دورك / Your turn</div><div class="two"><p dir="rtl">${it[5]}</p><p dir="ltr">${it[6]}</p></div>${edHTML(it[7],"t"+a,1)}</div>`}).join("")}`).join("")}</section>`);
app.addEventListener("click",e=>{const b=e.target.closest(".run,.chk,.sol");if(!b)return;const ed=b.closest(".ed"),ta=ed.querySelector("textarea"),o=ed.querySelector(".out");
if(b.classList.contains("sol")){ta.value=SOL[ed.id];ta.rows=ta.value.split("\n").length+1;return}
const r=exec(ta.value,{});const txt=r.out.join("\n");
if(b.classList.contains("run")){o.className="out";o.textContent=(txt||"")+(r.err?"\n⚠ "+r.err:"")||"(no output / لا يوجد ناتج)";return}
const ex=exec(SOL[ed.id],{}).out.join("\n");const good=!r.err&&txt.trim()==ex.trim();
o.className="out "+(good?"ok":"no");o.textContent=(good?"✅ صح! الناتج / Correct! Output:\n"+txt:"❌ مش مظبوط / Not yet.\nناتجك / Yours:\n"+(txt||"(nothing)")+(r.err?"\n⚠ "+r.err:"")+"\nالمطلوب / Expected:\n"+ex)});
/* ---------- QUESTION BANK ---------- */
const T=["True","False"],TA=["صح","خطأ"];
const Q=[
{k:"tf",n:6,en:"The ternary operator is a shorter way to write if...else.",ar:"العامل الثلاثي طريقة أقصر لكتابة if...else.",a:0,x:["صح: condition ? v1 : v2","True: condition ? v1 : v2"]},
{k:"tf",n:7,en:"The continue statement exits the loop entirely.",ar:"الأمر continue يخرج من الحلقة بالكامل.",a:1,x:["الذي يخرج هو break؛ continue يتخطى الدورة فقط.","break exits; continue only skips the current round."]},

const play=()=>{if(k<fr.length){const f=fr[k++];tk.innerHTML=track(f[0],f[1],lv,f[2]);rtm=setTimeout(play,320);return}
const won=!r.err&&pos==lv.goal&&stars.size==0&&(!lv.fn||/function|=>/.test(code));
if(won){msg.innerHTML="✅ ممتاز! الروبوت وصل / Great! The robot made it. 🎉";rtm=setTimeout(()=>{li++;rshow()},1600)}
else{busy=0;msg.textContent="❌ "+(r.err?r.err:!lv.fn||/function|=>/.test(code)?(pos!=lv.goal?"الروبوت لم يصل للعلم / It didn’t reach the flag.":"باقي نجوم لم تُجمع / Some stars are left."):"لازم تستخدمي دالة / You must use a function.")+" — جربي تاني / try again"}};
if(!fr.length&&!r.err)tk.innerHTML=track(0,lv.stars,lv);play()}
rshow();
/* ---------- routing ---------- */
function route(){const h=location.hash.slice(1),id=tabs.some(t=>t[0]==h)?h:"learn";clearInterval(gt);clearTimeout(rtm);app.querySelectorAll("section").forEach(s=>s.hidden=s.id!=id);$("#nav").querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",b.dataset.t==id));scrollTo(0,0)}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)location.hash=b.dataset.t};
addEventListener("hashchange",route);route();
</script>
